<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Roots 管理</title>
<style>
/* ─── shadcn default (neutral / zinc) — values only; legacy
   token NAMES kept so inline JS styles keep resolving ─────── */
:root {
  --primary: #18181B;        /* zinc-950  (shadcn primary) */
  --primary-l: #2F2F33;      /* primary/90 hover */
  --primary-bg: #F4F4F5;     /* zinc-100  (muted / accent) */
  --primary-ring: rgba(24,24,27,.12);
  --accent: #F59E0B;         /* amber — kept for stale/status dots */
  --danger: #EF4444;         /* shadcn destructive */
  --danger-d: #DC2626;
  --success: #16A34A;
  --info: #3B82F6;
  --bg: #FAFAFA;             /* app background */
  --surface: #FFFFFF;        /* card / popover */
  --border: #E4E4E7;         /* zinc-200 */
  --text: #09090B;           /* zinc-950 foreground */
  --text-sub: #71717A;       /* zinc-500 muted-foreground */
  --sidebar-w: 220px;
  --sidebar-bg: #FAFAFA;
  --sidebar-fg: #52525B;     /* zinc-600 */
  --sidebar-active: #ECECEE;
  --r: 0.5rem;               /* 8px (shadcn --radius) */
  --shadow: 0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -2px rgb(0 0 0 / .1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;font-size:13.5px;line-height:1.5;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{cursor:pointer;font:inherit;color:inherit;border:none;background:none}
input,textarea,select{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
a{color:var(--text);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(24,24,27,.12)}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:9999px;border:3px solid transparent;background-clip:padding-box}

/* Layout */
.layout{display:flex;height:100vh}

/* Sidebar (shadcn: light, bordered, rounded items) */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:var(--sidebar-fg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar__logo{padding:18px 16px 16px;font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--text);display:flex;align-items:center;gap:8px}
.sidebar__logo::before{content:"";width:18px;height:18px;border-radius:6px;background:var(--primary);flex-shrink:0}
.sidebar__logo span{font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-sub);background:var(--primary-bg);border:1px solid var(--border);padding:2px 6px;border-radius:5px}
.sidebar__nav{list-style:none;flex:1;padding:8px;display:flex;flex-direction:column;gap:2px}
.sidebar__item{padding:8px 12px;cursor:pointer;border-radius:calc(var(--r) - 2px);transition:background-color .15s,color .15s;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;color:var(--sidebar-fg)}
.sidebar__item:hover{background:var(--sidebar-active);color:var(--text)}
.sidebar__item.active{background:var(--sidebar-active);color:var(--text);font-weight:600}
.sidebar__footer{padding:14px 16px;font-size:11px;color:var(--text-sub);border-top:1px solid var(--border)}
.stale-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:none;margin-left:auto;flex-shrink:0}
.stale-dot.visible{display:block}

/* Main */
.main{flex:1;overflow:auto;background:var(--bg)}
.section{padding:28px 32px;min-height:100%}
.section__header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.section__title{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.section__sub{font-size:12px;color:var(--text-sub);margin-top:3px}
.section__actions{display:flex;gap:8px;align-items:center}

/* Stale banner */
.stale-banner{background:#FFFBEB;border:1px solid #FDE68A;border-radius:calc(var(--r) - 2px);padding:9px 14px;margin-bottom:16px;font-size:12px;color:#92400E;display:none;align-items:center;gap:8px}
.stale-banner.show{display:flex}

/* Buttons */
.btn{padding:7px 14px;border-radius:calc(var(--r) - 2px);font-size:13px;font-weight:500;line-height:1.25;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid transparent;color:var(--text);transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.btn:active{transform:translateY(.5px)}
.btn--primary{background:var(--primary);color:#fff}
.btn--primary:hover{background:var(--primary-l);color:#fff}
.btn--outline{border-color:var(--border);background:var(--surface);color:var(--text)}
.btn--outline:hover{background:var(--primary-bg)}
.btn--danger{background:var(--danger);color:#fff}
.btn--danger:hover{background:var(--danger-d);color:#fff}
.btn--ghost{color:var(--text);background:transparent;padding:6px 10px}
.btn--ghost:hover{background:var(--primary-bg)}
.btn--sm{padding:4px 10px;font-size:12px}
.btn--xs{padding:2px 8px;font-size:11px;border-radius:6px}
.btn--icon{padding:5px 8px;font-size:14px;border-radius:6px}
.btn:disabled{opacity:.5;pointer-events:none}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid var(--border);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow-md);border-color:#D4D4D8}
.card__head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.card__id{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--text-sub);background:var(--primary-bg);padding:2px 7px;border-radius:5px;border:1px solid var(--border);font-variant-numeric:tabular-nums}
.card__name{font-weight:600;font-size:15px;letter-spacing:-.01em;margin:4px 0 8px}
.card__meta{font-size:12px;color:var(--text-sub);display:flex;gap:12px;flex-wrap:wrap}
.card__actions{display:flex;gap:6px;margin-top:14px;align-items:center}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:9999px;font-size:11px;font-weight:600;line-height:1.5;border:1px solid transparent}
.badge--green{background:#DCFCE7;color:#166534;border-color:#bbf7d0}
.badge--grey{background:var(--primary-bg);color:var(--text-sub);border-color:var(--border)}
.badge--blue{background:#DBEAFE;color:#1D4ED8;border-color:#bfdbfe}
.badge--red{background:#FEE2E2;color:#991B1B;border-color:#fecaca}
.badge--orange{background:#FEF3C7;color:#92400E;border-color:#fde68a}
.badge--purple{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Toggle (shadcn Switch) */
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle__slider{position:absolute;inset:0;background:var(--border);border-radius:9999px;cursor:pointer;transition:background-color .2s}
.toggle__slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:var(--shadow)}
.toggle input:checked + .toggle__slider{background:var(--primary)}
.toggle input:checked + .toggle__slider::before{transform:translateX(18px)}
.toggle input:focus-visible + .toggle__slider{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}

/* Table */
.table-wrap{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;border:1px solid var(--border)}
.tbl th{background:transparent;font-size:12px;font-weight:500;color:var(--text-sub);padding:12px 16px;white-space:nowrap;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background-color .12s}
.tbl tbody tr:hover td{background:var(--primary-bg)}
.tbl tr.clickable{cursor:pointer}
.tbl .actions{display:flex;gap:4px;white-space:nowrap}

/* Progress bar */
.progress{background:var(--primary-bg);border-radius:9999px;height:8px;min-width:70px;overflow:hidden}
.progress__fill{background:var(--primary);border-radius:9999px;height:100%;transition:width .4s ease}

/* Inline edit */
.editable-cell{cursor:text;min-width:60px;border-radius:5px;transition:background-color .12s}
.editable-cell:hover{background:var(--primary-bg)}
.editable-input{width:100%;border:1px solid var(--primary);border-radius:6px;padding:3px 6px;font:inherit;outline:none;background:#fff;box-shadow:0 0 0 3px var(--primary-ring)}

/* Filter bar */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select,.filter-bar input[type=date]{padding:7px 11px;border:1px solid var(--border);border-radius:calc(var(--r) - 2px);background:#fff;font-size:13px;transition:border-color .15s,box-shadow .15s}
.filter-bar select:focus,.filter-bar input[type=date]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.filter-bar label{font-size:13px;color:var(--text-sub);display:flex;gap:6px;align-items:center;cursor:pointer}

/* Modal (shadcn Dialog) */
.modal-overlay{position:fixed;inset:0;background:rgb(0 0 0 / .8);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s ease}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:26px;min-width:400px;max-width:560px;width:90%;max-height:90vh;overflow-y:auto;position:relative;animation:dialogIn .18s ease}
.modal-card h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:20px;padding-right:30px}
.modal-close{position:absolute;top:16px;right:16px;font-size:16px;color:var(--text-sub);width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;transition:background-color .15s,color .15s}
.modal-close:hover{background:var(--primary-bg);color:var(--text)}

/* Drawer (shadcn Sheet) */
.drawer-overlay{position:fixed;inset:0;background:rgb(0 0 0 / .8);z-index:90;display:flex;justify-content:flex-end;animation:fadeIn .15s ease}
.drawer{width:500px;max-width:96vw;background:var(--surface);border-left:1px solid var(--border);height:100%;overflow-y:auto;box-shadow:var(--shadow-lg);padding:26px;animation:slideInRight .2s ease}
.drawer__title{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.drawer__section{margin-bottom:24px}
.drawer__section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sub);margin-bottom:10px}

/* Confirm (shadcn AlertDialog) */
.confirm-overlay{position:fixed;inset:0;background:rgb(0 0 0 / .8);display:flex;align-items:center;justify-content:center;z-index:110;animation:fadeIn .15s ease}
.confirm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:26px;min-width:320px;max-width:420px;animation:dialogIn .18s ease}
.confirm-card p{margin-bottom:20px;line-height:1.6;font-size:14px}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px}

/* Toast (shadcn Sonner: neutral surface + colored rail) */
.toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{padding:12px 16px;border-radius:calc(var(--r) - 2px);background:var(--surface);color:var(--text);border:1px solid var(--border);border-left-width:3px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .2s ease;max-width:340px}
.toast--success{border-left-color:var(--success)}
.toast--error{border-left-color:var(--danger)}
.toast--info{border-left-color:var(--info)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dialogIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:rgb(255 255 255 / .6);backdrop-filter:blur(1px);display:flex;align-items:center;justify-content:center;z-index:150}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Form */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:calc(var(--r) - 2px);font:inherit;transition:border-color .15s,box-shadow .15s;background:#fff}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--text-sub)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.form-group textarea{resize:vertical;min-height:74px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* System cards */
.sys-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.sys-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;border:1px solid var(--border);transition:box-shadow .15s}
.sys-card:hover{box-shadow:var(--shadow-md)}
.sys-card__icon{margin-bottom:12px;color:var(--text)}
.sys-card__title{font-weight:600;margin-bottom:6px;font-size:15px;letter-spacing:-.01em}
.sys-card__desc{font-size:12px;color:var(--text-sub);margin-bottom:16px;line-height:1.6}
.sys-result{margin-top:12px;padding:10px 12px;border-radius:calc(var(--r) - 2px);font-size:12px;border:1px solid transparent}
.sys-result--ok{background:#DCFCE7;color:#166534;border-color:#bbf7d0}
.sys-result--err{background:#FEE2E2;color:#991B1B;border-color:#fecaca}

/* Summary bar */
.summary-bar{background:var(--surface);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border:1px solid var(--border);color:var(--text-sub)}
.summary-bar strong{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* Task list in drawer */
.task-item{border:1px solid var(--border);border-radius:calc(var(--r) - 2px);margin-bottom:8px;background:#fff;overflow:hidden;transition:border-color .12s}
.task-item__header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background-color .12s}
.task-item__header:hover{background:var(--primary-bg)}
.task-item__arrow{font-size:11px;color:var(--text-sub);transition:transform .2s;flex-shrink:0}
.task-item__arrow.open{transform:rotate(90deg)}
.task-item__body{flex:1;min-width:0}
.task-item__title{font-size:13px;font-weight:500}
.task-item__meta{font-size:11px;color:var(--text-sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.task-item__controls{display:flex;gap:6px;flex-shrink:0;align-items:center}
.task-done .task-item__title{text-decoration:line-through;color:var(--text-sub)}

/* Items sub-panel */
.items-panel{border-top:1px solid var(--border);padding:10px 12px;background:var(--bg)}
.item-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-name-input{flex:1;font-size:12.5px;border:1px solid transparent;background:transparent;outline:none;min-width:0;padding:2px 6px;border-radius:5px;transition:background-color .12s,border-color .12s}
.item-name-input:hover{background:var(--primary-bg)}
.item-name-input:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.item-qty-wrap{display:flex;align-items:center;gap:3px;flex-shrink:0}
.item-qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text-sub);transition:background-color .12s,color .12s}
.item-qty-btn:hover{background:var(--primary-bg);color:var(--text)}
.item-qty{font-size:12px;font-weight:600;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.item-del-btn{color:#D4D4D8;font-size:14px;padding:3px 6px;border-radius:5px;transition:color .12s,background-color .12s}
.item-del-btn:hover{color:var(--danger);background:#FEE2E2}
.item-done .item-name-input{text-decoration:line-through;color:var(--text-sub)}
.item-add-row{display:flex;gap:6px;margin-top:8px}
.item-add-input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:calc(var(--r) - 2px);font-size:12.5px;background:#fff;transition:border-color .12s,box-shadow .12s}
.item-add-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.item-add-qty{width:54px;padding:6px 8px;border:1px solid var(--border);border-radius:calc(var(--r) - 2px);font-size:12.5px;text-align:center;background:#fff;transition:border-color .12s,box-shadow .12s}
.item-add-qty:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}

.hidden{display:none!important}
.text-sub{color:var(--text-sub)}
.mt-10{margin-top:10px}
.mt-16{margin-top:16px}
.empty{text-align:center;padding:48px 44px;color:var(--text-sub);font-size:13px}
.tag{display:inline-flex;align-items:center;background:var(--primary-bg);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:11px;color:var(--text-sub);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.info-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row__label{min-width:120px;color:var(--text-sub);font-size:12px}

/* ─── SVG icons (monochrome, inherits currentColor) ─── */
.ic{width:16px;height:16px;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic--sm{width:14px;height:14px;vertical-align:-2px;stroke-width:2}
.ic--lg{width:24px;height:24px}

/* ─── Custom checkbox (clean black check, replaces emoji/native) ─── */
.chk{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.6px solid #C7C7CC;border-radius:5px;background:#fff;cursor:pointer;position:relative;flex-shrink:0;transition:background-color .12s,border-color .12s;margin:0}
.chk:hover{border-color:var(--text)}
.chk:checked{background:var(--text);border-color:var(--text)}
.chk:checked::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-ring)}

/* ─── Centered sheet (large center panel for couple tasks) ─── */
.sheet-overlay{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:95;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);padding:24px;animation:fadeIn .15s ease}
.sheet{width:840px;max-width:100%;max-height:90vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow-y:auto;padding:30px 34px;animation:dialogIn .18s ease}
.sheet .drawer__section{margin-bottom:24px}
@media(max-width:600px){.sheet{padding:22px}}

/* ─── Schedule / Calendar ─────────────────────────────── */
.sched-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
@media (max-width:1100px){.sched-grid{grid-template-columns:1fr}}
.sched-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sched-panel__head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sched-panel__title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.sched-panel__sub{font-size:11px;color:var(--text-sub);margin-top:2px}
.sched-panel__body{padding:8px 0;max-height:560px;overflow-y:auto}

.upcoming-row{display:flex;align-items:flex-start;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background-color .12s}
.upcoming-row:last-child{border-bottom:none}
.upcoming-row:hover{background:var(--primary-bg)}
.upcoming-row__date{flex-shrink:0;width:62px;text-align:center;border:1px solid var(--border);border-radius:6px;padding:4px 0;background:#fff;font-variant-numeric:tabular-nums}
.upcoming-row__date .m{font-size:10px;color:var(--text-sub);display:block;line-height:1}
.upcoming-row__date .d{font-size:18px;font-weight:600;display:block;line-height:1.1;margin-top:2px}
.upcoming-row__date.is-overdue{background:#FEE2E2;border-color:#fecaca;color:#991B1B}
.upcoming-row__date.is-overdue .m{color:#991B1B}
.upcoming-row__date.is-soon{background:#FEF3C7;border-color:#fde68a;color:#92400E}
.upcoming-row__date.is-soon .m{color:#92400E}
.upcoming-row__body{flex:1;min-width:0}
.upcoming-row__top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upcoming-row__title{font-size:13px;font-weight:500;line-height:1.35}
.upcoming-row__meta{font-size:11px;color:var(--text-sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.upcoming-row.is-done .upcoming-row__title{text-decoration:line-through;color:var(--text-sub)}

/* Calendar grid */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav__title{font-size:13px;font-weight:600;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border)}
.cal-dow{padding:6px 0;text-align:center;font-size:11px;font-weight:600;color:var(--text-sub);background:var(--bg);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.cal-dow.sun{color:#DC2626}
.cal-dow.sat{color:#2563EB}
.cal-cell{min-height:84px;padding:5px 6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:#fff;cursor:pointer;transition:background-color .12s;position:relative;overflow:hidden}
.cal-cell:hover{background:var(--primary-bg)}
.cal-cell.is-other{background:#FAFAFA;color:#A1A1AA;cursor:default}
.cal-cell.is-other:hover{background:#FAFAFA}
.cal-cell.is-today{background:#EFF6FF}
.cal-cell.is-today:hover{background:#DBEAFE}
.cal-cell__num{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.cal-cell.sun .cal-cell__num{color:#DC2626}
.cal-cell.sat .cal-cell__num{color:#2563EB}
.cal-cell__chip{display:block;font-size:10px;line-height:1.25;padding:2px 5px;margin-top:3px;border-radius:4px;background:var(--primary-bg);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--border)}
.cal-cell__chip.is-overdue{background:#FEE2E2;border-color:#fecaca;color:#991B1B}
.cal-cell__chip.is-done{background:#DCFCE7;border-color:#bbf7d0;color:#166534;text-decoration:line-through}
.cal-cell__more{font-size:10px;color:var(--text-sub);margin-top:2px}
</style>
</head>

<script>
(function () {
'use strict';

// ─── SWR Cache ────────────────────────────────────────────
const swrCache = {
  get: function(key) {
    try { var v = sessionStorage.getItem('swr_' + key); return v ? JSON.parse(v) : null; }
    catch(e) { return null; }
  },
  set: function(key, data) {
    try { sessionStorage.setItem('swr_' + key, JSON.stringify(data)); }
    catch(e) {}
  }
};

function showStaleDot(section) {
  var el = document.getElementById('dot-' + section);
  if (el) el.classList.add('visible');
}
function hideStaleDot(section) {
  var el = document.getElementById('dot-' + section);
  if (el) el.classList.remove('visible');
}

// api: loading overlay, no cache
function api(fn, args, onOk, onErr) {
  showLoading();
  var runner = google.script.run
    .withSuccessHandler(function(r){ hideLoading(); onOk(r); })
    .withFailureHandler(function(e){ hideLoading(); toast((e&&e.message)||'エラーが発生しました','error'); if(onErr)onErr(e); });
  runner[fn].apply(runner, args || []);
}

// apiSWR: render stale immediately, then re-render with fresh data (no overlay)
function apiSWR(fn, args, cacheKey, onData) {
  var stale = swrCache.get(cacheKey);
  if (stale) {
    onData(stale, true);
    showStaleDot(state.section);
  } else {
    showLoading();
  }
  google.script.run
    .withSuccessHandler(function(r) {
      hideLoading();
      swrCache.set(cacheKey, r);
      hideStaleDot(state.section);
      onData(r, false);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      if (!stale) toast((e&&e.message)||'エラーが発生しました','error');
      else toast('バックグラウンド更新に失敗しました','error');
    })
    [fn].apply(google.script.run, args || []);
}

// ─── State ────────────────────────────────────────────────
var state = {
  section: 'venues',
  venues: [],
  taskFilter: { venueId: '', showInactive: false },
  customerFilter: { venueId: '' },
  logFilter: { venueId: '', date: todayStr() },
  scheduleFilter: { venueId: '', month: thisMonthStr(), hideDone: true },
};

function thisMonthStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1);
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n){ return String(n).padStart(2,'0'); }

// ─── UI helpers ───────────────────────────────────────────
function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast toast--' + (type||'info');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-ov').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal-ov').classList.add('hidden'); }

function openDrawer(html) {
  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('drawer-ov').classList.remove('hidden');
}
function closeDrawer() { document.getElementById('drawer-ov').classList.add('hidden'); }

function openSheet(html) {
  document.getElementById('sheet-body').innerHTML = html;
  var ov = document.getElementById('sheet-ov');
  ov.classList.remove('hidden');
  ov.scrollTop = 0;
}
function closeSheet() { document.getElementById('sheet-ov').classList.add('hidden'); }

function confirmDialog(msg, onOk) {
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-ov').classList.remove('hidden');
  document.getElementById('confirm-ok').onclick = function() {
    document.getElementById('confirm-ov').classList.add('hidden');
    onOk();
  };
  document.getElementById('confirm-cancel').onclick = function() {
    document.getElementById('confirm-ov').classList.add('hidden');
  };
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function trunc(s,n){ return s&&s.length>n ? s.slice(0,n)+'…' : (s||''); }

// ─── SVG icon helper (monochrome, inherits currentColor) ──
var ICONS = {
  building:'<path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3M9 9h.01M9 13h.01M9 17h.01"/>',
  clipboard:'<path d="M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1zM8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
  mail:'<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  refresh:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
  play:'<path d="M5 3l16 9-16 9V3z"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
  trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  bag:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.2 5.2l-6.1 6.1a1.5 1.5 0 0 0 2.1 2.1l6.1-6.1a4 4 0 0 0 5.2-5.2l-2.4 2.4-2.1-2.1 2.4-2.4z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  xcircle:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
  bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>'
};
function ic(name, cls) {
  return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';
}

function badgeStatus(status) {
  var map={sent:'green',pending:'orange',failed:'red'};
  return '<span class="badge badge--'+(map[status]||'grey')+'">'+esc(status)+'</span>';
}

function venueOptions(venues, selected) {
  return '<option value="">全式場</option>' +
    venues.map(function(v){
      return '<option value="'+esc(v.venue_id)+'"'+(v.venue_id===selected?' selected':'')+'>'+esc(v.venue_name)+'</option>';
    }).join('');
}

function staleBanner() {
  return '<div class="stale-banner" id="stale-banner">'+ic('bolt','ic--sm')+' キャッシュを表示中 — バックグラウンドで更新しています…</div>';
}

// ─── Navigation ───────────────────────────────────────────
document.getElementById('nav-list').addEventListener('click', function(e){
  var li = e.target.closest('[data-s]');
  if (!li) return;
  document.querySelectorAll('.sidebar__item').forEach(function(el){el.classList.remove('active');});
  li.classList.add('active');
  state.section = li.dataset.s;
  renderSection(state.section);
});
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-ov').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.getElementById('drawer-ov').addEventListener('click', function(e){ if(e.target===this) closeDrawer(); });
document.getElementById('sheet-ov').addEventListener('click', function(e){ if(e.target===this) closeSheet(); });
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal(); closeDrawer(); closeSheet(); document.getElementById('confirm-ov').classList.add('hidden'); }
});

function renderSection(s) {
  var m = document.getElementById('main');
  m.innerHTML = '<div class="section"><div class="empty"><div class="spinner" style="margin:0 auto 12px"></div></div></div>';
  if (s==='schedule')  renderSchedule();
  if (s==='venues')    renderVenues();
  if (s==='tasks')     renderTasks();
  if (s==='customers') renderCustomers();
  if (s==='logs')      renderLogs();
  if (s==='system')    renderSystem();
}

// ═══════════════════════════════════════════════════════════
// ⓪ タスクカレンダー（管理者ホーム）
// ═══════════════════════════════════════════════════════════
function renderSchedule() {
  apiSWR('getDashboardVenues', [], 'venues', function(venues, isStale){
    state.venues = venues || [];
    loadAndRenderSchedule(isStale);
  });
}

// 月の範囲 (今月の前後を含めるためカレンダー表示用に拡張) を計算
function monthRange(monthStr) {
  // monthStr: YYYY-MM
  var parts = monthStr.split('-');
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  var first = new Date(y, m-1, 1);
  var last  = new Date(y, m,   0);
  // カレンダーグリッド用に前後の空白日も含める
  var gridFrom = new Date(first); gridFrom.setDate(gridFrom.getDate() - first.getDay());
  var gridTo   = new Date(last);  gridTo.setDate(gridTo.getDate() + (6 - last.getDay()));
  return { y:y, m:m, first:first, last:last, gridFrom:gridFrom, gridTo:gridTo };
}

function isoFromDate(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function loadAndRenderSchedule(parentStale) {
  var venueId = state.scheduleFilter.venueId;
  var range = monthRange(state.scheduleFilter.month);
  // カレンダー範囲 + 直近14日を確実にカバーするため、開始を min(gridFrom, today) にする
  var today = new Date(); today.setHours(0,0,0,0);
  var fromDate = range.gridFrom < today ? range.gridFrom : today;
  // 終了は max(gridTo, today+14)
  var soon = new Date(today); soon.setDate(soon.getDate()+14);
  var toDate = range.gridTo > soon ? range.gridTo : soon;
  // overdueも見たいので、十分過去から取得（180日前）
  var deepFrom = new Date(today); deepFrom.setDate(deepFrom.getDate()-180);
  if (deepFrom < fromDate) fromDate = deepFrom;

  var fromIso = isoFromDate(fromDate);
  var toIso   = isoFromDate(toDate);
  var cacheKey = 'sched_'+(venueId||'all')+'_'+fromIso+'_'+toIso;

  apiSWR('getDashboardSchedule', [venueId||null, fromIso, toIso], cacheKey, function(entries, isStale){
    renderScheduleUI(entries||[], range, isStale||parentStale);
  });
}

function renderScheduleUI(entries, range, isStale) {
  var today = new Date(); today.setHours(0,0,0,0);
  var todayIso = isoFromDate(today);
  var soonIso  = isoFromDate(new Date(today.getTime() + 14*86400000));

  // 直近: 期限切れ未完了 + 今日〜14日以内の未完了
  var upcoming = entries.filter(function(e){
    if (e.is_done) return false;
    return e.due_date <= soonIso; // 過去〜14日以内
  }).sort(function(a,b){ return a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : 0; });

  // カレンダー: 現在表示中の月のグリッド範囲
  var calFromIso = isoFromDate(range.gridFrom);
  var calToIso   = isoFromDate(range.gridTo);
  var calEntries = entries.filter(function(e){ return e.due_date >= calFromIso && e.due_date <= calToIso; });
  var byDate = {};
  calEntries.forEach(function(e){ (byDate[e.due_date]||(byDate[e.due_date]=[])).push(e); });

  var overdueCount = upcoming.filter(function(e){return e.due_date < todayIso;}).length;
  var todayCount   = upcoming.filter(function(e){return e.due_date === todayIso;}).length;
  var soonCount    = upcoming.length - overdueCount - todayCount;

  var m = document.getElementById('main');
  m.innerHTML =
    '<div class="section">' +
      staleBanner() +
      '<div class="section__header">' +
        '<div><h1 class="section__title">タスクカレンダー</h1><p class="section__sub">期限切れ <strong style="color:var(--danger)">'+overdueCount+'</strong> ／ 今日 '+todayCount+' ／ 14日以内 '+soonCount+'</p></div>' +
      '</div>' +
      '<div class="filter-bar">' +
        '<select id="sched-venue-filter">'+venueOptions(state.venues, state.scheduleFilter.venueId)+'</select>' +
        '<label><input type="checkbox" id="sched-hide-done"'+(state.scheduleFilter.hideDone?' checked':'')+'>完了を隠す</label>' +
      '</div>' +

      '<div class="sched-grid">' +
        // 左: 直近の手配タスク
        '<div class="sched-panel">' +
          '<div class="sched-panel__head">' +
            '<div><div class="sched-panel__title" style="display:flex;align-items:center;gap:6px">'+ic('alert','ic--sm')+' 直近の手配タスク</div><div class="sched-panel__sub">期限切れ・今日〜14日以内の未完了</div></div>' +
          '</div>' +
          '<div class="sched-panel__body">' + renderUpcomingRows(upcoming, todayIso) + '</div>' +
        '</div>' +

        // 右: 月カレンダー
        '<div class="sched-panel">' +
          '<div class="sched-panel__head">' +
            '<div><div class="sched-panel__title" style="display:flex;align-items:center;gap:6px">'+ic('calendar','ic--sm')+' 月カレンダー</div><div class="sched-panel__sub">日付クリックで詳細</div></div>' +
            '<div class="cal-nav">' +

function renderUpcomingRows(upcoming, todayIso) {
  var rows = state.scheduleFilter.hideDone ? upcoming.filter(function(e){return !e.is_done;}) : upcoming;
  if (!rows.length) return '<p class="empty" style="padding:32px 18px">直近で対応が必要なタスクはありません</p>';
  return rows.map(function(e){
    var dateClass = '';
    if (e.due_date < todayIso) dateClass = 'is-overdue';
    else if (e.due_date <= isoFromDate(new Date(Date.now()+3*86400000))) dateClass = 'is-soon';
    var dParts = e.due_date.split('-');
    var diffBadge;
    if (e.days_until < 0)      diffBadge = '<span class="badge badge--red">'+(-e.days_until)+'日超過</span>';
    else if (e.days_until===0) diffBadge = '<span class="badge badge--orange">今日</span>';
    else                       diffBadge = '<span class="badge badge--grey">あと'+e.days_until+'日</span>';
    return '<div class="upcoming-row'+(e.is_done?' is-done':'')+'" data-line-id="'+esc(e.line_id)+'" data-venue-id="'+esc(e.venue_id)+'">' +
      '<div class="upcoming-row__date '+dateClass+'">' +
        '<span class="m">'+parseInt(dParts[1],10)+'月</span>' +
        '<span class="d">'+parseInt(dParts[2],10)+'</span>' +
      '</div>' +
      '<div class="upcoming-row__body">' +
        '<div class="upcoming-row__top">' +
          '<span class="upcoming-row__title">'+esc(e.task_content)+'</span>' +
          diffBadge +
        '</div>' +
        '<div class="upcoming-row__meta">' +
          '<span style="display:inline-flex;align-items:center;gap:3px">'+ic('heart','ic--sm')+' '+esc(e.couple_name)+'</span>' +
          (e.venue_name?'<span style="display:inline-flex;align-items:center;gap:3px">'+ic('building','ic--sm')+' '+esc(e.venue_name)+'</span>':'') +
          (e.category?'<span>'+esc(e.category)+'</span>':'') +

function renderCalendarGrid(range, byDate, todayIso) {
  var dows = ['日','月','火','水','木','金','土'];
  var html = '<div class="cal-grid">';
  dows.forEach(function(d,i){
    var cls = i===0?'cal-dow sun':i===6?'cal-dow sat':'cal-dow';
    html += '<div class="'+cls+'">'+d+'</div>';
  });
  var cur = new Date(range.gridFrom);
  while (cur <= range.gridTo) {
    var iso = isoFromDate(cur);
    var inMonth = (cur.getMonth()+1) === range.m;
    var dow = cur.getDay();
    var classes = 'cal-cell';
    if (!inMonth) classes += ' is-other';
    if (iso === todayIso) classes += ' is-today';
    if (dow===0) classes += ' sun';
    if (dow===6) classes += ' sat';

    var list = byDate[iso] || [];
    var hideDone = state.scheduleFilter.hideDone;
    var visible = hideDone ? list.filter(function(e){return !e.is_done;}) : list;
    var maxChips = 3;
    var chips = visible.slice(0, maxChips).map(function(e){
      var c = 'cal-cell__chip';
      if (e.is_done) c += ' is-done';
      else if (e.due_date < todayIso) c += ' is-overdue';
      return '<span class="'+c+'" title="'+esc(e.couple_name+' / '+e.task_content)+'">'+esc(e.couple_name.split(' & ')[0]||e.couple_name)+' · '+esc(e.task_content)+'</span>';
    }).join('');
    var more = visible.length > maxChips ? '<div class="cal-cell__more">+'+(visible.length-maxChips)+' 件</div>' : '';

    html += '<div class="'+classes+'" data-iso="'+iso+'">' +
      '<div class="cal-cell__num">'+cur.getDate()+'</div>' +
      chips + more +
    '</div>';
    cur.setDate(cur.getDate()+1);
  }
  html += '</div>';
  return html;
}

    loadAndRenderSchedule();
  });
  document.getElementById('cal-next').addEventListener('click', function(){

    loadAndRenderSchedule();
  });
  document.getElementById('cal-today').addEventListener('click', function(){
    state.scheduleFilter.month = thisMonthStr();

    cell.addEventListener('click', function(){

      openDayDrawer(this.dataset.iso, byDate[this.dataset.iso] || []);

    row.addEventListener('click', function(){

function shiftMonth(monthStr, delta) {
  var parts = monthStr.split('-');
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1+delta, 1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}

function openDayDrawer(iso, entries) {
  var dParts = iso.split('-');
  var label = parseInt(dParts[0],10)+'年 '+parseInt(dParts[1],10)+'月 '+parseInt(dParts[2],10)+'日';
  var todayIso = isoFromDate((function(){var d=new Date();d.setHours(0,0,0,0);return d;})());
  var list = state.scheduleFilter.hideDone ? entries.filter(function(e){return !e.is_done;}) : entries;

  var body = '';
  if (!list.length) {
    body = '<p class="text-sub" style="font-size:12px">この日のタスクはありません</p>';
  } else {
    body = list.map(function(e){
      var diffBadge;
      if (e.days_until < 0)      diffBadge = '<span class="badge badge--red">'+(-e.days_until)+'日超過</span>';
      else if (e.days_until===0) diffBadge = '<span class="badge badge--orange">今日</span>';
      else                       diffBadge = '<span class="badge badge--grey">あと'+e.days_until+'日</span>';
      return '<div class="task-item'+(e.is_done?' task-done':'')+'" data-line-id="'+esc(e.line_id)+'" data-venue-id="'+esc(e.venue_id)+'" style="cursor:pointer">' +
        '<div class="task-item__header">' +
          '<div class="task-item__body">' +
            '<div class="task-item__title">'+esc(e.task_content)+'</div>' +
            '<div class="task-item__meta">' +
              '<span style="display:inline-flex;align-items:center;gap:3px">'+ic('heart','ic--sm')+' '+esc(e.couple_name)+'</span>' +
              (e.venue_name?'<span style="display:inline-flex;align-items:center;gap:3px">'+ic('building','ic--sm')+' '+esc(e.venue_name)+'</span>':'') +
              (e.category?'<span>'+esc(e.category)+'</span>':'') +
              diffBadge +
              (e.is_done?'<span class="badge badge--green">完了</span>':'') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  openDrawer(
    '<div class="drawer__title"><span style="display:inline-flex;align-items:center;gap:6px">'+ic('calendar')+' '+esc(label)+'</span><button class="btn btn--sm btn--outline" onclick="closeDrawer()">閉じる</button></div>' +
    '<div class="drawer__section"><div class="drawer__section-label">'+list.length+'件のタスク</div>' + body + '</div>'
  );
  document.querySelectorAll('#drawer-body .task-item[data-line-id]').forEach(function(item){
    item.addEventListener('click', function(){
      closeDrawer();
      openCustomerDrawer(this.dataset.lineId, this.dataset.venueId || '');
    });
  });
}

function bindTaskTableEvents() {
  var tbody = document.querySelector('#tasks-table tbody');
  if (!tbody) return;
  tbody.addEventListener('click', function(e){
    var cell = e.target.closest('.editable-cell');
    if (!cell||cell.querySelector('input,textarea')) return;
    var field = cell.dataset.field;
    var taskId = cell.closest('tr').dataset.taskId;
    var orig = cell.textContent.trim();
    var isLong = ['task_content','reminder_message','memo'].indexOf(field)>=0;
    cell.innerHTML = isLong
      ? '<textarea class="editable-input" rows="3">'+esc(orig)+'</textarea>'
      : '<input class="editable-input" value="'+esc(orig)+'">';
    var inp = cell.querySelector('input,textarea');
    inp.focus();
    inp.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();this.blur();}
      if(ev.key==='Escape'){cell.textContent=orig;}
    });
    inp.addEventListener('blur', function(){
      var val = this.value;
      if(val===orig){cell.textContent=orig;return;}
      api('updateTaskField',[taskId,field,val],function(){
        cell.textContent = field==='reminder_message'?trunc(val,28):val;
        toast('保存しました','success');
        swrCache.set('tasks_'+(state.taskFilter.venueId||'base'), null);
      }, function(){cell.textContent=orig;});
    });
  });
  tbody.addEventListener('click', function(e){
    var btn = e.target.closest('.task-toggle-btn');
    if(!btn) return;
    var tr = btn.closest('tr'); var taskId = tr.dataset.taskId;
    var isActive = tr.querySelector('.badge--green')!==null;
    api('toggleTaskActive',[taskId,!isActive],function(){
      toast(isActive?'停止しました':'有効化しました','success');
      swrCache.set('tasks_'+(state.taskFilter.venueId||'base'), null);
      loadAndRenderTasks();
    });
  });
  tbody.addEventListener('click', function(e){
    var btn = e.target.closest('.task-test-btn');
    if(!btn||btn.disabled) return;
    var taskId = btn.closest('tr').dataset.taskId;
    var venueId = state.taskFilter.venueId;
    if(!venueId){toast('式場を選択してください','error');return;}
    confirmDialog('プランナーにテスト送信しますか？（'+taskId+'）', function(){
      api('testLineSend',[taskId,venueId],function(r){ toast(r.message||'送信しました',r.ok?'success':'error'); });
    });
  });
  tbody.addEventListener('click', function(e){
    var btn = e.target.closest('.task-del-btn');
    if(!btn) return;
    var taskId = btn.closest('tr').dataset.taskId;
    confirmDialog('タスク「'+taskId+'」を削除しますか？', function(){
      api('toggleTaskActive',[taskId,false],function(){
        toast('削除しました','success');
        swrCache.set('tasks_'+(state.taskFilter.venueId||'base'), null);
        loadAndRenderTasks();
      });
    });
  });
  tbody.addEventListener('click', function(e){
    var btn = e.target.closest('.task-items-btn');
    if(!btn) return;
    var tr = btn.closest('tr');
    openTaskItemTemplateModal(tr.dataset.taskId, tr.dataset.content||'');
  });
}

function loadTaskItemTemplates(taskId) {
  google.script.run
    .withSuccessHandler(function(items){ renderTaskItemTemplates(taskId, items||[]); })
    .withFailureHandler(function(e){ toast((e&&e.message)||'読み込み失敗','error'); })
    .getTaskItemTemplatesForTask(taskId);
}

function renderTaskItemTemplates(taskId, items) {
  var wrap = document.getElementById('tpl-items-wrap');
  if (!wrap) return;
  var rows = items.length
    ? items.map(function(it){
        return '<div class="item-row" data-item-id="'+esc(it.item_id)+'">' +
          '<input type="text" class="item-name-input tpl-name" value="'+esc(it.item_name)+'" data-item-id="'+esc(it.item_id)+'">' +
          '<div class="item-qty-wrap">' +
            '<button class="item-qty-btn tpl-qty-minus" data-item-id="'+esc(it.item_id)+'">'+ic('minus','ic--sm')+'</button>' +
            '<span class="item-qty" id="tplqty-'+esc(it.item_id)+'">'+it.quantity+'</span>' +
            '<button class="item-qty-btn tpl-qty-plus" data-item-id="'+esc(it.item_id)+'">'+ic('plus','ic--sm')+'</button>' +
          '</div>' +
          '<button class="item-del-btn tpl-del" data-item-id="'+esc(it.item_id)+'" title="削除">'+ic('trash','ic--sm')+'</button>' +
        '</div>';
      }).join('')
    : '<p style="font-size:11.5px;color:var(--text-sub);padding:6px 0 10px">手配物テンプレートはまだありません</p>';
  wrap.innerHTML =
    '<div class="items-panel" style="border-top:none;border-radius:calc(var(--r) - 2px);border:1px solid var(--border)">' +
      rows +
      '<div class="item-add-row">' +
        '<input class="item-add-input tpl-add-name" type="text" placeholder="手配物名（例: メインドレス）">' +
        '<input class="item-add-qty tpl-add-qty" type="number" min="1" value="1">' +
        '<button class="btn btn--sm btn--primary tpl-add-btn">追加</button>' +
      '</div>' +
    '</div>';
  bindTaskItemTemplateEvents(taskId);
}

function bindTaskItemTemplateEvents(taskId) {
  var wrap = document.getElementById('tpl-items-wrap');
  if (!wrap) return;
  wrap.querySelector('.tpl-add-btn').addEventListener('click', function(){
    var nameInp = wrap.querySelector('.tpl-add-name');
    var qtyInp  = wrap.querySelector('.tpl-add-qty');
    var name = nameInp.value.trim();
    if (!name){ toast('手配物名を入力してください','error'); return; }
    var qty = parseInt(qtyInp.value,10)||1;
    api('addTaskItemTemplate',[taskId,name,qty],function(){
      nameInp.value=''; qtyInp.value='1';
      loadTaskItemTemplates(taskId);
      toast('追加しました','success');
    });
  });
  wrap.addEventListener('blur', function(e){
    var inp = e.target.closest('.tpl-name');
    if (!inp) return;
    var val = inp.value.trim();
    if (!val) return;
    api('updateDashboardTaskItem',[inp.dataset.itemId,{item_name:val}],function(){ toast('保存しました','success'); });
  }, true);
  wrap.addEventListener('click', function(e){
    var minus = e.target.closest('.tpl-qty-minus');
    var plus  = e.target.closest('.tpl-qty-plus');
    var btn = minus || plus;
    if (!btn) return;
    var id = btn.dataset.itemId;
    var qEl = document.getElementById('tplqty-'+id);
    var cur = parseInt(qEl.textContent,10)||1;
    var next = minus ? Math.max(1,cur-1) : cur+1;
    qEl.textContent = next;
    api('updateDashboardTaskItem',[id,{quantity:next}],function(){});
  });
  wrap.addEventListener('click', function(e){
    var btn = e.target.closest('.tpl-del');
    if (!btn) return;
    var id = btn.dataset.itemId;
    confirmDialog('この手配物テンプレートを削除しますか？', function(){
      api('deleteDashboardTaskItem',[id],function(){
        loadTaskItemTemplates(taskId);
        toast('削除しました','success');
      });
    });
  });
}

function openCustomerDrawer(lineId, venueId) {
  // Load tasks + items in parallel (both SWR)
  var tasks = null, items = null, customer = null;
  var loaded = 0;
  function tryRender() {
    loaded++;
    if (loaded < 3) return;
    renderCustomerDrawerContent(lineId, venueId, customer, tasks, items);
  }

  apiSWR('getCustomerTasks', [lineId, venueId||null], 'ctasks_'+lineId, function(t){ tasks=t; tryRender(); });
  apiSWR('getDashboardTaskItems', [lineId], 'citems_'+lineId, function(i){ items=i; tryRender(); });
  apiSWR('getDashboardCustomers', [null], 'customers_all', function(all){
    customer = (all||[]).find(function(x){return x.line_id===lineId;}) || {line_id:lineId,venue_id:venueId||'',name1_kana:'',name2_kana:'',wedding_date:''};
    tryRender();
  });

  // Show placeholder immediately (centered sheet)
  openSheet('<div style="display:flex;align-items:center;justify-content:center;height:160px"><div class="spinner"></div></div>');
}

function renderCustomerTaskList(tasks, itemsByTask, lineId, venueId) {
  if (!tasks.length) return '<p class="text-sub" style="font-size:12px">タスクがありません</p>';
  return tasks.map(function(t){
    var taskItems = itemsByTask[t.task_id] || [];
    var doneCount = taskItems.filter(function(i){return i.is_done;}).length;
    var doneClass = t.is_done ? ' task-done' : '';
    var itemsBadge = taskItems.length > 0
      ? '<span class="badge badge--'+(doneCount===taskItems.length?'green':'orange')+'" style="font-size:10px;display:inline-flex;align-items:center;gap:3px">'+ic('bag','ic--sm')+' '+doneCount+'/'+taskItems.length+'</span>'
      : '';
    return '<div class="task-item'+doneClass+'" data-task-id="'+esc(t.task_id)+'">' +
      '<div class="task-item__header">' +
        '<input type="checkbox" class="task-item__check chk" data-task-id="'+esc(t.task_id)+'"'+(t.is_done?' checked':'')+' title="完了" onclick="event.stopPropagation()">' +
        '<span class="task-item__arrow">'+ic('chevron','ic--sm')+'</span>' +
        '<div class="task-item__body">' +
          '<div class="task-item__title">'+esc(t.task_content)+'</div>' +
          '<div class="task-item__meta">' +
            (t.category?'<span>'+esc(t.category)+'</span>':'') +
            '<span style="display:inline-flex;align-items:center;gap:3px">'+ic('calendar','ic--sm')+' '+esc(t.due_estimate||'—')+'</span>' +
            (t.is_custom?'<span class="badge badge--purple" style="font-size:10px">個別</span>':'') +
            (!t.is_visible?'<span class="badge badge--grey" style="font-size:10px">非表示</span>':'') +
            itemsBadge +
          '</div>' +
        '</div>' +
        '<div class="task-item__controls">' +
          '<label class="toggle" style="width:34px;height:19px" onclick="event.stopPropagation()" title="表示/非表示">' +
            '<input type="checkbox" class="vis-toggle" data-task-id="'+esc(t.task_id)+'"'+(t.is_visible?' checked':'')+' style="width:0;height:0;opacity:0;position:absolute">' +
            '<span class="toggle__slider"></span>' +
          '</label>' +
          (t.is_custom ? '<button class="btn btn--xs btn--outline cust-task-del" data-task-id="'+esc(t.task_id)+'" onclick="event.stopPropagation()" title="削除" style="border-color:var(--danger);color:var(--danger)">削除</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="items-panel hidden" id="items-'+esc(t.task_id)+'">' +
        renderItemRows(taskItems, t.task_id, lineId) +
        '<div class="item-add-row">' +
          '<input class="item-add-input" type="text" placeholder="手配物名（例: メインドレス）" data-task-id="'+esc(t.task_id)+'">' +
          '<input class="item-add-qty" type="number" min="1" value="1">' +
          '<button class="btn btn--sm btn--primary item-add-btn" data-task-id="'+esc(t.task_id)+'">追加</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderItemRows(taskItems, taskId, lineId) {
  if (!taskItems.length) return '<p style="font-size:11px;color:var(--text-sub);padding:6px 0 10px">手配物はまだありません</p>';

    return '<div class="item-row'+(it.is_done?' item-done':'')+'" data-item-id="'+esc(it.item_id)+'">' +

        '<span class="item-qty" id="qty-'+esc(it.item_id)+'">'+it.quantity+'</span>' +
        '<button class="item-qty-btn item-qty-plus" data-item-id="'+esc(it.item_id)+'">'+ic('plus','ic--sm')+'</button>' +
      '</div>' +
      '<button class="item-del-btn" data-item-id="'+esc(it.item_id)+'" title="削除">'+ic('x','ic--sm')+'</button>' +
    '</div>';
  }).join('');
}

function bindCustomerDrawerEvents(lineId, venueId, c, name) {
  // Edit form
  document.getElementById('cust-edit-form').addEventListener('submit', function(e){
    e.preventDefault();
    var d = fd(this);
    d.venue_id = document.getElementById('cust-venue-sel').value;
    api('updateCustomer',[lineId,d],function(){
      toast('保存しました','success');
      swrCache.set('customers_all', null);
      loadAndRenderCustomers();
    });
  });

  // Task header click → expand/collapse
  document.getElementById('cust-tasks-list').addEventListener('click', function(e){
    var header = e.target.closest('.task-item__header');
    if (!header) return;
    if (e.target.closest('.vis-toggle,.cust-task-del,.item-qty-btn,.item-done-chk,.item-add-btn,.task-item__check')) return;
    var taskItem = header.closest('.task-item');
    var taskId = taskItem.dataset.taskId;
    var panel = document.getElementById('items-'+taskId);
    var arrow = header.querySelector('.task-item__arrow');
    if (!panel) return;
    var isOpen = !panel.classList.contains('hidden');
    panel.classList.toggle('hidden', isOpen);
    if (arrow) arrow.classList.toggle('open', !isOpen);
  });

  // Task done checkbox (progress)
  document.getElementById('cust-tasks-list').addEventListener('change', function(e){
    var chk = e.target.closest('.task-item__check');
    if (!chk) return;
    var taskId = chk.dataset.taskId;
    var taskItem = chk.closest('.task-item');
    showLoading();
    google.script.run
      .withSuccessHandler(function(){
        hideLoading(); toast('更新しました','success');
        if (taskItem) taskItem.classList.toggle('task-done', chk.checked);
        swrCache.set('ctasks_'+lineId, null);
        swrCache.set('customers_all', null);
      })
      .withFailureHandler(function(err){ hideLoading(); toast(err.message||'エラー','error'); chk.checked=!chk.checked; })
      .updateOrCreateTaskProgress(lineId, taskId, chk.checked);
  });

  // Vis toggle
  document.getElementById('cust-tasks-list').addEventListener('change', function(e){
    var tog = e.target.closest('.vis-toggle');
    if (!tog) return;
    var taskId = tog.dataset.taskId;
    api('toggleCustomerTaskVisibility',[lineId,taskId,tog.checked],function(){
      toast('表示設定を更新しました','success');
      swrCache.set('ctasks_'+lineId, null);
    });
  });

  // Delete custom task
  document.getElementById('cust-tasks-list').addEventListener('click', function(e){
    var btn = e.target.closest('.cust-task-del');
    if (!btn) return;
    var taskId = btn.dataset.taskId;
    confirmDialog('このタスクを削除しますか？', function(){
      api('removeCustomTaskFromCustomer',[taskId],function(){
        toast('削除しました','success');
        swrCache.set('ctasks_'+lineId, null);
        refreshCustomerTasks(lineId, venueId);
      });
    });
  });

  // Add custom task form
  document.getElementById('add-cust-task-form').addEventListener('submit', function(e){
    e.preventDefault();
    var d = fd(this);
    if (!d.task_content){toast('タスク内容は必須です','error');return;}
    api('addTaskToCustomer',[lineId, c.venue_id||'', d],function(){
      toast('タスクを追加しました','success');
      this.reset();
      swrCache.set('ctasks_'+lineId, null);
      refreshCustomerTasks(lineId, venueId);
    }.bind(this));
  });

  // Reset progress
  document.getElementById('cust-reset-btn').addEventListener('click', function(){
    confirmDialog('「'+name+'」の全進捗を削除します。この操作は取り消せません。', function(){
      api('resetCustomerProgress',[lineId],function(r){
        toast('リセットしました（'+r.deleted+'件削除）','success');
        swrCache.set('ctasks_'+lineId, null);
        swrCache.set('customers_all', null);
        loadAndRenderCustomers();
        refreshCustomerTasks(lineId, venueId);
      });
    });
  });

  // ─── Item events ──────────────────────────────────────────
  document.getElementById('cust-tasks-list').addEventListener('change', function(e){
    var chk = e.target.closest('.item-done-chk');
    if (!chk) return;
    var itemId = chk.dataset.itemId;
    var row = chk.closest('.item-row');
    var nameInp = row.querySelector('.item-name-input');
    api('updateDashboardTaskItem',[itemId,{is_done:chk.checked}],function(){
      row.classList.toggle('item-done', chk.checked);
      if (nameInp) nameInp.style.textDecoration = chk.checked ? 'line-through' : '';
      if (nameInp) nameInp.style.color = chk.checked ? 'var(--text-sub)' : '';
      swrCache.set('citems_'+lineId, null);
      refreshItemBadge(row, lineId);
    });
  });

  document.getElementById('cust-tasks-list').addEventListener('blur', function(e){
    var inp = e.target.closest('.item-name-input');
    if (!inp) return;
    var itemId = inp.dataset.itemId;
    var val = inp.value.trim();
    if (!val) return;
    api('updateDashboardTaskItem',[itemId,{item_name:val}],function(){
      swrCache.set('citems_'+lineId, null);
      toast('保存しました','success');
    });
  }, true);

  document.getElementById('cust-tasks-list').addEventListener('click', function(e){
    var minusBtn = e.target.closest('.item-qty-minus');
    var plusBtn  = e.target.closest('.item-qty-plus');
    var btn = minusBtn || plusBtn;
    if (!btn) return;
    var itemId = btn.dataset.itemId;
    var qtyEl = document.getElementById('qty-'+itemId);
    if (!qtyEl) return;
    var cur = parseInt(qtyEl.textContent,10)||1;
    var next = minusBtn ? Math.max(1, cur-1) : cur+1;
    qtyEl.textContent = next;
    api('updateDashboardTaskItem',[itemId,{quantity:next}],function(){
      swrCache.set('citems_'+lineId, null);
    });
  });

  document.getElementById('cust-tasks-list').addEventListener('click', function(e){
    var btn = e.target.closest('.item-del-btn');
    if (!btn) return;
    var itemId = btn.dataset.itemId;
    var row = btn.closest('.item-row');
    var panel = row.closest('.items-panel');
    confirmDialog('この手配物を削除しますか？', function(){
      api('deleteDashboardTaskItem',[itemId],function(){
        row.remove();
        swrCache.set('citems_'+lineId, null);
        refreshItemBadge(panel, lineId);
        toast('削除しました','success');
      });
    });
  });

  document.getElementById('cust-tasks-list').addEventListener('click', function(e){
    var btn = e.target.closest('.item-add-btn');
    if (!btn) return;
    var taskId = btn.dataset.taskId;
    var addRow = btn.closest('.item-add-row');
    var nameInp = addRow.querySelector('.item-add-input');
    var qtyInp  = addRow.querySelector('.item-add-qty');
    var itemName = nameInp.value.trim();
    if (!itemName){toast('手配物名を入力してください','error');return;}
    var qty = parseInt(qtyInp.value,10)||1;
    api('addDashboardTaskItem',[lineId,taskId,itemName,qty],function(r){
      var panel = document.getElementById('items-'+taskId);
      if (!panel) return;
      var addRowEl = panel.querySelector('.item-add-row');
      var newRow = document.createElement('div');
      newRow.innerHTML = renderItemRows([r], taskId, lineId);
      addRowEl.before(newRow.firstChild);
      nameInp.value = ''; qtyInp.value = '1';
      swrCache.set('citems_'+lineId, null);
      refreshItemBadge(panel, lineId);
      toast('追加しました','success');
    });
  });
}

function refreshItemBadge(el, lineId) {
  var panel = el.closest ? el.closest('.items-panel') : el;
  if (!panel) return;
  var taskItem = panel.closest('.task-item');
  if (!taskItem) return;
  var rows = panel.querySelectorAll('.item-row');
  var done = panel.querySelectorAll('.item-row.item-done').length;
  var total = rows.length;
  var meta = taskItem.querySelector('.task-item__meta');
  if (!meta) return;
  var old = meta.querySelector('.badge--orange,.badge--green');
  if (old) old.remove();
  if (total > 0) {
    var span = document.createElement('span');
    span.className = 'badge badge--'+(done===total?'green':'orange');
    span.style.cssText = 'font-size:10px;display:inline-flex;align-items:center;gap:3px';
    span.innerHTML = ic('bag','ic--sm')+' '+done+'/'+total;
    meta.appendChild(span);
  }
}

function refreshCustomerTasks(lineId, venueId) {
  var tasks = null, items = null;
  function tryRender() {
    if (tasks===null||items===null) return;
    var itemsByTask = {};
    (items||[]).forEach(function(it){ (itemsByTask[it.task_id]||(itemsByTask[it.task_id]=[])).push(it); });
    var listEl = document.getElementById('cust-tasks-list');
    if (listEl) listEl.innerHTML = renderCustomerTaskList(tasks, itemsByTask, lineId, venueId||'');
  }
  apiSWR('getCustomerTasks',[lineId,venueId||null],'ctasks_'+lineId,function(t){ tasks=t; tryRender(); });
  apiSWR('getDashboardTaskItems',[lineId],'citems_'+lineId,function(i){ items=i; tryRender(); });
}

// ═══════════════════════════════════════════════════════════
// ④ 送信ログ
// ═══════════════════════════════════════════════════════════
function renderLogs() {
  apiSWR('getDashboardVenues', [], 'venues', function(venues, isStale){
    state.venues = venues || [];
    loadAndRenderLogs(isStale);
  });
}

function loadAndRenderLogs(parentStale) {
  var key = 'logs_'+(state.logFilter.venueId||'all')+'_'+(state.logFilter.date||'all');
  apiSWR('getDashboardDrafts',[state.logFilter.venueId||null,state.logFilter.date||null], key, function(drafts, isStale){
    renderLogsUI(drafts, isStale||parentStale);
  });
}

function renderLogsUI(drafts, isStale) {
  var total=drafts.length, sent=drafts.filter(function(d){return d.status==='sent';}).length, pending=drafts.filter(function(d){return d.status==='pending';}).length;
  var m = document.getElementById('main');
  m.innerHTML =
    '<div class="section">' +
      staleBanner() +
      '<div class="section__header"><h1 class="section__title">送信ログ</h1></div>' +
      '<div class="filter-bar">' +
        '<select id="log-venue-filter">'+venueOptions(state.venues, state.logFilter.venueId)+'</select>' +
        '<input type="date" id="log-date-filter" value="'+esc(state.logFilter.date||'')+'">' +
        '<button class="btn btn--outline btn--sm" id="log-clear-date">日付クリア</button>' +
      '</div>' +
      '<div class="summary-bar">合計 <strong>'+total+'</strong> 件 ／ 送信済 <strong>'+sent+'</strong> 件 ／ 未送信 <strong>'+pending+'</strong> 件</div>' +
      '<div class="table-wrap">' +
        '<table class="tbl" id="log-table">' +
          '<thead><tr><th>カップル</th><th>task_id</th><th>メッセージ</th><th>状態</th><th>作成日時</th></tr></thead>' +
          '<tbody>'+renderLogRows(drafts)+'</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
  if (isStale) document.getElementById('stale-banner').classList.add('show');
  document.getElementById('log-venue-filter').addEventListener('change', function(){
    state.logFilter.venueId=this.value; loadAndRenderLogs();
  });
  document.getElementById('log-date-filter').addEventListener('change', function(){
    state.logFilter.date=this.value; loadAndRenderLogs();
  });
  document.getElementById('log-clear-date').addEventListener('click', function(){
    state.logFilter.date=''; document.getElementById('log-date-filter').value=''; loadAndRenderLogs();
  });
  document.querySelector('#log-table tbody').addEventListener('click', function(e){
    var tr = e.target.closest('tr[data-draft-id]');
    if (!tr) return;
    openDraftDrawer(tr.dataset.draftId, drafts);
  });
}

function renderLogRows(drafts) {
  if (!drafts.length) return '<tr><td colspan="5" class="empty">データがありません</td></tr>';
  return drafts.map(function(d){
    return '<tr class="clickable" data-draft-id="'+esc(d.draft_id)+'">' +
      '<td>'+esc(d.couple_name||d.couple_id)+'</td>' +
      '<td><span class="tag">'+esc(d.task_id)+'</span></td>' +
      '<td style="max-width:220px">'+esc(trunc(d.draft_message,50))+'</td>' +
      '<td>'+badgeStatus(d.status)+'</td>' +
      '<td>'+esc(d.created_at?d.created_at.slice(0,16).replace('T',' '):'—')+'</td>' +
    '</tr>';
  }).join('');
}

function openDraftDrawer(draftId, drafts) {
  var d = drafts.find(function(x){return x.draft_id===draftId;});
  if (!d) return;
  openDrawer(
    '<div class="drawer__title"><span style="display:inline-flex;align-items:center;gap:6px">'+ic('mail')+' ドラフト詳細</span><button class="btn btn--sm btn--outline" onclick="closeDrawer()">閉じる</button></div>' +
    '<div class="drawer__section">' +
      ir('draft_id',d.draft_id)+ir('カップル',d.couple_name||d.couple_id)+ir('task_id',d.task_id)+
      ir('状態',d.status)+ir('作成日時',d.created_at?d.created_at.slice(0,16).replace('T',' '):'—')+
      ir('送信日時',d.sent_at?d.sent_at.slice(0,16).replace('T',' '):'—') +
    '</div>' +
    '<div class="drawer__section">' +
      '<div class="drawer__section-label">メッセージ</div>' +
      '<textarea id="draft-msg-edit" style="width:100%;min-height:140px;padding:10px;border:1px solid var(--border);border-radius:8px;font:inherit;resize:vertical">'+esc(d.draft_message)+'</textarea>' +
      '<div style="margin-top:10px"><button class="btn btn--primary btn--sm" id="draft-save-btn">保存</button></div>' +
    '</div>' +
    '<div class="drawer__section">' +
      '<div class="drawer__section-label">状態変更</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<select id="draft-status-sel">'+['pending','sent','failed'].map(function(s){return '<option value="'+s+'"'+(s===d.status?' selected':'')+'>'+s+'</option>';}).join('')+'</select>' +
        '<button class="btn btn--outline btn--sm" id="draft-status-btn">変更</button>' +
      '</div>' +
    '</div>'
  );
  document.getElementById('draft-save-btn').addEventListener('click', function(){
    var msg = document.getElementById('draft-msg-edit').value;
    api('editDraftMessage',[draftId,msg],function(){ toast('保存しました','success'); d.draft_message=msg; });
  });
  document.getElementById('draft-status-btn').addEventListener('click', function(){
    var status = document.getElementById('draft-status-sel').value;
    api('changeDraftStatus',[draftId,status],function(){
      toast('状態を「'+status+'」に変更しました','success'); d.status=status; loadAndRenderLogs();
    });
  });
}

// ═══════════════════════════════════════════════════════════
// ⑤ システム操作
// ═══════════════════════════════════════════════════════════
function renderSystem() {
  var m = document.getElementById('main');
  m.innerHTML =
    '<div class="section">' +
      '<div class="section__header"><h1 class="section__title">システム操作</h1></div>' +
      '<div class="sys-cards">' +
        sysCard('sys-remind','mail','手動リマインド実行','現在すべての登録カップルに対し、期限3日以内の未完了タスクのリマインド通知を LINE で送信します。','全カップルに送信','btn--danger') +
        sysCard('sys-setup','wrench','初期セットアップ','6つのシートのヘッダーを初期化します。初回のみ実行してください。','セットアップを実行','btn--outline') +
        sysCard('sys-trigger','clock','リマインドトリガー登録','sendReminders() を毎日9:00に自動実行するトリガーを登録します。','トリガーを登録','btn--outline') +
      '</div>' +
    '</div>';
  document.getElementById('sys-remind-btn').addEventListener('click', function(){
    confirmDialog('本当に全カップルにリマインドを送信しますか？\nLINEに即時送信されます。', function(){
      api('runSendReminders',[],function(){ toast('リマインド送信完了','success'); showSysResult('sys-remind','完了',true); }, function(e){ showSysResult('sys-remind',(e&&e.message||'失敗'),false); });
    });
  });
  document.getElementById('sys-setup-btn').addEventListener('click', function(){
    confirmDialog('シートのヘッダーを初期化します。実行しますか？', function(){
      api('runSetupEnvironment',[],function(){ toast('セットアップ完了','success'); showSysResult('sys-setup','完了',true); }, function(e){ showSysResult('sys-setup',(e&&e.message||'失敗'),false); });
    });
  });
  document.getElementById('sys-trigger-btn').addEventListener('click', function(){
    confirmDialog('毎朝9時のトリガーを登録します。実行しますか？', function(){
      api('runSetupRemindTrigger',[],function(){ toast('トリガー登録完了','success'); showSysResult('sys-trigger','完了（毎日 9:00）',true); }, function(e){ showSysResult('sys-trigger',(e&&e.message||'失敗'),false); });
    });
  });
}

function sysCard(id,icon,title,desc,btnLabel,btnClass){
  return '<div class="sys-card"><div class="sys-card__icon">'+ic(icon,'ic--lg')+'</div><div class="sys-card__title">'+esc(title)+'</div><div class="sys-card__desc">'+esc(desc)+'</div><button class="btn btn--sm '+btnClass+'" id="'+id+'-btn">'+esc(btnLabel)+'</button><div id="'+id+'-result"></div></div>';
}
function showSysResult(id,msg,ok){
  var el=document.getElementById(id+'-result');
  if(!el)return;
  el.className='sys-result '+(ok?'sys-result--ok':'sys-result--err');
  el.innerHTML=ic(ok?'check':'xcircle','ic--sm')+' '+esc(msg);
}

// ─── Form helpers ─────────────────────────────────────────
function fg(name,label,type,value,placeholder){
  value=value!==undefined?value:''; placeholder=placeholder||'';
  var isTA=type==='textarea';
  return '<div class="form-group"><label>'+esc(label)+'</label>'+(isTA
    ?'<textarea name="'+name+'" placeholder="'+esc(placeholder)+'">'+esc(value)+'</textarea>'
    :'<input type="'+type+'" name="'+name+'" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'">')+'</div>';
}
function fd(form){ var d={}; new FormData(form).forEach(function(v,k){d[k]=v;}); return d; }
function ir(label,value){
  return '<div class="info-row"><span class="info-row__label">'+esc(label)+'</span><span>'+esc(value)+'</span></div>';
}

// ─── Boot ─────────────────────────────────────────────────
renderSection('venues');

})();
</script>
